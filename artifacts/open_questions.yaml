# 本研究の未解決の論点と、次の一手 (トップページに掲示)。
#
# artifacts/limitations.md が「この研究で言えないこと」を列挙するのに対し、こちらは
# 「だから次に何を確かめるか」を持つ。読んだ人が議論に入れるよう、論点ごとに
# 〈なぜ論点か / 次の一手 / 関連する知見・issue〉を揃える。
#
# status:
#   open     : 着手していない(誰でも拾える)
#   planned  : やることは決まっているが未着手
#   blocked  : 前提条件が揃うまで実行しない(発火条件を next に書く)
#
# 数値はここに書かない。実測値はレポート本文・findings.json 側にある。

intro: >-
  本研究の結論は「本設定では被験者数削減を確定できない」という帰無である。帰無を確定に
  近づけるにも、逆に削減を示すにも、次の論点が残っている。優先度順に並べる。

questions:
  - id: Q1
    question: 反復数が足りず、必要被験者数 N* の信頼区間が広い
    why: >-
      被験者数実験は各点3反復しかなく、点推定では削減が見えても信頼区間が対照と重なる。
      本研究の中心的な主張(対照を超える削減がない)は、この幅の広さに支えられている部分が
      あり、反復を増やせば結論が変わりうる唯一の項目でもある。
    next: 各被験者数で10反復以上に増やし、検出力設計(どの削減幅なら検出できるか)を先に置く
    priority: 最優先
    status: planned
    related: [F-8, F-10, F-12]
    issue: 7

  - id: Q2
    question: どの公開データで、どんな予測タスクを解くべきか
    why: >-
      現在の対象は行動認識に偏り(UCI HAR / WISDM / PAMAP2)、非HAR は WESAD 1件で、それも
      枠組みが転移せず near-chance だった。「拡張が実被験者を代替できるか」を問うには、
      被験者ごとの計測が高コストで、かつタスクが実際に学習可能なデータが要る。
    next: 被験者ID付き・group split 可能・学習可能性が確認できる候補を、タスク定義とセットで洗い出す
    priority: 高
    status: open
    related: [F-13, F-14]
    issue: 21

  - id: Q3
    question: 拡張強度を1点に固定しており、「手法の効果」と「強度選択の効果」が交絡している
    why: >-
      ratio・sigma・alpha・k・window は各手法1点のみ。ある手法が効かなかったのが手法自体の
      性質なのか、たまたま選んだ強度が悪かったのかを分離できていない。
    next: 主要手法について強度スイープを行い、手法ごとの最良点と、点固定の結果との差を測る
    priority: 高
    status: open
    related: [F-5, F-6]
    issue: null

  - id: Q4
    question: negative control が label_shuffle 1本しかない
    why: >-
      対照越え判定の厳しさは対照の設計に依存する。label_shuffle は元データを保持したまま
      ラベルノイズを乗せる悲観的対照であり、純粋な量水増し(oversample)とは別の性質を持つ。
      対照が1種類だと、判定基準の妥当性そのものを検証できない。
    next: 純ノイズ拡張・時間シャッフルなど、性質の異なる対照を追加して判定の頑健性を確かめる
    priority: 中
    status: open
    related: [F-10]
    issue: null

  - id: Q5
    question: 生理信号に HAR 向けの前処理をそのまま当てているのは妥当か
    why: >-
      WESAD が near-chance だった候補要因は、窓ごとz正規化が皮膚電気活動や体温の絶対レベル
      —— 生理信号の主要な情報 —— を消していることにある。前処理が原因なら、「信号種依存」と
      いう結論は前処理の選択の結論にすぎない可能性がある。
    next: 窓ごとz正規化の有無を切り替える ablation を行い、学習可能性が回復するかを見る
    priority: 中
    status: open
    related: [F-14]
    issue: 27

  - id: Q6
    question: MiniRocket で拡張が効かない機序が分かっていない
    why: >-
      効果のモデル依存は再現できたが、なぜ効かないかは未解明。ランダム畳み込み特徴が拡張後の
      変動をすでに捉えているのか、線形分類器が飽和しているのかで、示唆はまったく異なる。
    next: 特徴量空間で拡張前後の分布を比較し、変換後に差が残っているかを確かめる
    priority: 中
    status: open
    related: [F-6, F-11]
    issue: null

  - id: Q7
    question: 生成モデル系の拡張(TimeGAN, Private Evolution 等)は本設定で有効か
    why: >-
      評価したのは古典的な変換・混合手法のみ。生成モデルは学習データ全体の分布を学ぶため、
      少データでの振る舞いも、プライバシー上の含意も、本研究の手法群とは性質が異なる。
    next: 時系列への適用可能性と論点(計算コスト・再現性・評価の落とし穴)を先に整理する
    priority: 低
    status: open
    related: []
    issue: 20

  - id: Q8
    question: そもそもデータ拡張が「手元データから効率的に情報を得る」方策として合理的なのはどんな条件か
    why: >-
      本研究は個別手法の効果を測ったが、どんな条件なら拡張に期待してよいのかという上位の
      問いには答えていない。帰無が続くなら、期待できる条件の側を先に定式化するほうが早い。
    next: 仮説を整理し、検証可能な形(どの条件で何が成り立てば支持されるか)に落とす
    priority: 低
    status: open
    related: [F-5, F-6, F-15]
    issue: 12

  - id: Q9
    question: マルチモーダル(チャネル横断)の拡張は削減に効くか
    why: >-
      チャネル間の関係を使う拡張は本研究で未評価。ただし測るには「多モーダル かつ 削減が
      測定可能」なデータが要り、現状どのデータもその条件を満たさない。
    next: 多モーダルで N*(none) が格子内に収まり、かつ対照が明確に劣るデータが得られたら着手する
    priority: 低
    status: blocked
    related: [F-13, F-14, F-15]
    issue: 27
