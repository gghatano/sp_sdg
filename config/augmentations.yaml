# Augmentation registry. `ratio` is the fraction of synthetic samples added
# relative to the original training set size (1.0 doubles the training set).
# Augmenters only ever see training data (see spec section 8).
augmentations:
  none:
    method: none
    params: {}

  oversample:
    method: oversample
    params:
      ratio: 1.0

  jitter:
    method: jitter
    params:
      ratio: 1.0
      sigma: 0.03

  scaling:
    method: scaling
    params:
      ratio: 1.0
      sigma: 0.1

  mixup:
    method: mixup
    params:
      ratio: 1.0
      alpha: 0.2

  dtw:
    method: dtw
    params:
      ratio: 1.0
      window: 0.1

  smote:
    method: smote
    params:
      ratio: 1.0
      k: 5

  # Negative control (Phase 5): synthetic samples with randomized labels.
  # Must NOT yield a subject-count reduction; validates the analysis pipeline.
  label_shuffle:
    method: label_shuffle
    params:
      ratio: 1.0

  # Generative (issue #42, task GN-A1). Unlike the other methods this one
  # trains a generator; the fit happens inside the augment call on the
  # training split it is handed and is never cached (spec section 8).
  # Hyperparameters are a first, untuned setting - see J-VAE-HPARAMS in
  # artifacts/judgment_calls.yaml. Sweeping them is task GN-A3.
  vae:
    method: vae
    params:
      ratio: 1.0
      latent_dim: 16
      steps: 2000
      beta: 1.0
      lr: 0.003
      batch_size: 64
